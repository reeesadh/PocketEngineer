<!DOCTYPE html>
<html>
    <head>
        <!-- import font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

        <title>Pocket Engineer</title>
        <style>
            /* overall app style */
            * {box-sizing: border-box; margin: 0; padding: 0;}
            body {background: #0d0d0d; color: #fff; font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column; height: 100vh;}

            header {display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 3px solid #222;}
            h2 {color: #2a92d7;}

            /* user chat input style */
            #chat {
                flex: 1; 
                overflow-y: auto; 
                padding: 16px; 
                flex-direction: column; 
                display: flex; 
                gap: 10px; 
                float: right;
            }
            .msg-row {display: flex;}
            .msg-row.user {justify-content: flex-end;}
            .msg-row.assistant {justify-content: flex-start;}
            .bubble {
                max-width: 70%; 
                padding: 10px 14px; 
                border-radius: 16px; 
                font-size: 14px; 
                line-height: 1.5; 
                word-break: break-word;
            }
            .bubble.user {
                background: #1d4ed8; 
                color: #fff; 
                border-bottom-right-radius: 4px;
                float: right;
            }
            .bubble.assistant {
                background: #1a1a1a; 
                border: 1px solid #333; 
                color: #fff; 
                border-radius: 20px;
                border-bottom-left-radius: 1px;
                float: left;
            }
            .label {
                font-size: 11px; 
                color: #888; 
                margin-bottom: 4px;
            }
            .msg-row.user .label {text-align: right;}

            #input-bar {
                display: flex; 
                gap: 8px; 
                padding: 12px 16px; 
                border-top: 1px solid #222;
            }
            #input-bar input {flex: 1; 
                padding: 8px 12px; 
                border-radius: 8px; 
                border: 1px solid #444; 
                background: #1a1a1a; 
                color: #fff; 
                font-size: 14px; 
                outline: none;
            }
            #input-bar button {
                padding: 8px 16px; 
                border-radius: 8px; 
                border: 1px solid #555; 
                background: #1a1a1a; 
                color: #fff; 
                font-size: 14px; 
                cursor: pointer;
            }
            #input-bar button:hover {background: #999;}

            .unitprog {
                position: relative;
                border-bottom: 1px dotted black;
                cursor: pointer;
            }

            .unitprogtext {
                visibility: hidden;
                width: 100px;
                background-color: #222;
                color: #fff;
                text-align: center;
                border-radius: 8px;
                padding: 6px 10px;
                position: absolute;
                bottom: 110%;
                left: 50%;
                transform: translateX(-50%);
                z-index: 10;
            }
            
            .unitprog:hover .unitprogtext {
                visibility: visible;
            }
        </style>
</head>
<body>
<header>
    <h2>PocketEngineer: Physics Dashboard</h2>
    <div id="progress-bar-background" style="width: 400px; height: 22px; background-color: #444; border-radius: 6px; border: 1px solid #535871">
        <div id="progress-bar-filled" style="width: 10px; height: 20px; background-color: blue; border-radius: 6px;"></div>
    </div>
    <img src="https://png.pngtree.com/png-vector/20231202/ourmid/pngtree-rocket-launch-icon-rocket-png-image_10809381.png" width="60" height="60">
    <div style="display: flex; align-items: center; gap: 4px;">
    </div>
</header>
<header>
    <h6>Click on a unit to test your knowledge</h6>
</header>

    <!-- input chat button -->
    <div style="display: flex; flex: 1; overflow: hidden;">
        <!-- chat -->
        <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
            <div id="chat"></div>
            <div id="input-bar">
                <input id="input" type="text" placeholder="Type here..." onkeydown="if(event.key==='Enter') send()" />
                <button onclick="send()">Send</button>
            </div>
        </div>
        <!-- unit map -->
        <div id="unit-map" style="width: 800px; background: #0d0d0d; border-left: 1px solid #222; padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; overflow-x: visible; align-items: center;">
            <div class="box-1"></div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
