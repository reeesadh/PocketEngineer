<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<html>
    <body style="background:rgb(0, 0, 0); color:rgb(0, 0, 0); font-family: 'JetBrains Mono';">
        <h1 style="color: brown;"></h1>
        <div id="title">
        </div>
        <div id="quiz">
        </div>

        <script>

            let unitIndex = null;
            
            window.electronAPI.onUpdateQuiz((html) => {
                const udiv = document.getElementById("unit-index");
                const ldiv = document.getElementById("loading");

                if (udiv) {
                    unitIndex = udiv.textContent;
                    udiv.remove();
                }

                console.log("LOADING");
                console.log(ldiv);
 
                if (title) {
                    title.insertAdjacentHTML('beforeend', html);
                }
            });

            const diagnosticCheckPath = window.electronAPI.getDiagnosticCheckPath();
            let questionsToReview = "";

            window.electronAPI.onUpdateQuizAnswers((data) => {
                const {divId, button} = data;

                const ldiv = document.getElementById("loading");
                if (ldiv) {
                    ldiv.remove();
                }

                let parentDiv = document.getElementById(divId);
                if (!parentDiv) {
                    parentDiv = document.createElement("div");
                    parentDiv.id = divId;
                    document.body.appendChild(parentDiv);
                }

                async function loadDiagnosticData() {
                    try {
                        const res = await fetch('./diagnostic_check.json');
                        const data = await res.json();
                        console.log("LOADED DIAGNOSTIC DATA: " + data);
                        return data;
                    } catch (e) {
                        console.error(e);
                        return null;
                    }
                }

                async function updateDiagnosticData(question_index, correct) {
                    try {
                        window.electronAPI.sendUpdateDiagnosticCheck(question_index, correct);
                    } catch (e) {
                        console.error(e);
                    }
                }

                console.log("BUTTON ", button);
                console.log("div ", parentDiv);
                   
                const qbutton = document.createElement("button");
                qbutton.textContent = button.text;
                qbutton.style.fontSize = "20px";
                
                qbutton.style.backgroundColor = "#3385c4";
                qbutton.style.color = button.color;
                qbutton.style.borderColor = "black";
                qbutton.style.padding = "12px 12px";
                qbutton.style.paddingRight = "12px";
                qbutton.style.borderRadius = "12px";
                qbutton.dataset.correct = button.isCorrect;

                let divnum = Number(divId.at(-1))
                updateDiagnosticData(divnum, null);

                async function qbuttonClick(event) {
                    console.log("button clicked");
                    const isCorrect = event.target.dataset.correct === "true";
                    console.log(`button clicked ${isCorrect}`);
                    
                    if (isCorrect) {
                        qbutton.style.backgroundColor = "green";
                    } else {
                        qbutton.style.backgroundColor = "red";
                    }

                    // update question progress in array
                    console.log(divnum);
                    console.log(isCorrect);
                    console.log("BUTTON CONTENT: " + qbutton.textContent);
                    const allitems = document.querySelectorAll(`#${divId} button`);
                    for (item in allitems) {
                        console.log("BUTTON CONTENT: " + item.textContent);
                    }
                    console.log(divId);
                    updateDiagnosticData(divnum, isCorrect);
                    const ddata = await loadDiagnosticData();
                    if (ddata && !ddata.some(item => item.value ===null)) {
                        console.log("done");
                        let score_correct = 0;
                        let score_total = 0;
                        for (d in ddata) {
                            if (ddata[d].value == true) {
                                score_correct++;
                            }
                            score_total++;
                        }
                        document.body.innerHTML = '';
                        const score = document.createElement("h1");
                        score.textContent = score_correct + " out of " + score_total;
                        score.style.color = "#0008ff";
                        document.body.appendChild(score);
                        console.log(unitIndex);
                        console.log("sending data from quiz.html: ", event, score_correct, score_total, unitIndex);
                        window.electronAPI.onDiagnosticCheckDone(event, score_correct, score_total, unitIndex);
                        if (score_correct >= 1) {
                            // UPDATE UNIT BUTTON COLOR
                            window.electronAPI.tellRendererUnitCorrect(event, unitIndex);
                        }
                        window.electronAPI.tellRendererDiagnosticDone(event);
                        
                    }
                    // remove onclick for all buttons for that divid
                    const allqbuttons = document.querySelectorAll(`#${divId} button`);
                    for (const qb of allqbuttons) {
                        qb.disabled = true;
                    }

                }

                qbutton.addEventListener("click", qbuttonClick);

                parentDiv.appendChild(qbutton);
            });
        </script>
    </body>
    </html>
